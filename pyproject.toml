[project]
name = "job-agent"
version = "0.1.0"
description = "Agentic human-in-the-loop job search and application engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "sqlalchemy[asyncio]>=2.0",
    "pyyaml>=6",
    "structlog>=24",
    "python-jobspy>=1.1",
    "httpx>=0.27",
    "tenacity>=8",
    "selectolax>=0.3",
    "anthropic>=0.39",
    "typst>=0.15",
    "pikepdf>=9",
    "playwright>=1.62.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "apscheduler>=3.10,<4",
    "tzlocal>=5.4.4",
    "google-genai>=2.22.0",
    "asyncpg>=0.30",
    "openai>=3.19.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pyright>=1.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "core", "scraper", "scorer", "resume", "automation", "bot", "orchestrator", "prep", "benchmark"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
