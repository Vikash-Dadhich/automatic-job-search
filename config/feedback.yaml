# Empirical rates from submitted applications. This does not change fit or priority.
# priority_integration stays false until a later calibration phase turns it on.

version: phase16-v1

feedback:
  minimum_overall: 20
  minimum_segment: 10
  minimum_subfamily: 20
  # Pseudo-count pulled toward the overall strong-positive rate.
  shrinkage_prior: 20
  max_adjustment: 5
  # A shrunk gap of 0.20 (20 percentage points) becomes an adjustment of 5.
  adjustment_per_rate: 25
  priority_integration: false
  bands:
    - {name: "0-49", min: 0, max: 49}
    - {name: "50-64", min: 50, max: 64}
    - {name: "65-74", min: 65, max: 74}
    - {name: "75-84", min: 75, max: 84}
    - {name: "85-100", min: 85, max: 100}
  groups:
    early_positive: [screening, interview, offer]
    strong_positive: [interview, offer]
    final_positive: [offer]
    negative: [rejected, ghosted]
  dimensions:
    - overall
    - fit_band
    - priority_band
    - role_family
    - role_subfamily
    - eligibility
    - method
    - source
