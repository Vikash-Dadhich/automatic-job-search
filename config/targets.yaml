# Discovery targets for LinkedIn/Indeed (JobSpy) and Workday CXS tenants.
# Search phrases live in config/discovery.yaml (role family, bucket, query).
# load_targets() copies the enabled queries onto search.terms for callers that
# still read the flat list. Sites, location, and Workday boards stay here.

search:
  sites:
    - linkedin
    - indeed
    - google
    - zip_recruiter
  location: "United States"
  distance: 50
  # Fetch depth per term per site. Higher = better recall (captures ranks 26-50)
  # at low added LLM cost since the internship filter culls most before scoring.
  results_wanted: 50
  country_indeed: "USA"
  # 36h window (vs 24h) gives low-ranked good jobs more chances across runs;
  # upsert dedupe prevents re-processing anything already seen.
  hours_old: 36
  linkedin_fetch_description: true

# Each URL was checked against that company's public Workday job API.
# Starbucks, Nike, Amazon, and Microsoft do not publish a myworkdayjobs board,
# so they stay on the LinkedIn/Indeed search above.
# A saved browser session is still required before auto-fill for each company.
workday_tenants:
  - name: "NVIDIA"
    url: "https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite"
    search_terms: []

  - name: "Salesforce"
    url: "https://salesforce.wd12.myworkdayjobs.com/Futureforce_Internships"
    search_terms: []

  - name: "Workday"
    url: "https://workday.wd5.myworkdayjobs.com/Workday_Early_Career"
    search_terms: []

  - name: "Zillow"
    url: "https://zillow.wd5.myworkdayjobs.com/Zillow_Group_External"
    search_terms: []

  - name: "Boeing"
    url: "https://boeing.wd1.myworkdayjobs.com/EXTERNAL_CAREERS"
    search_terms: []

  - name: "Adobe"
    url: "https://adobe.wd5.myworkdayjobs.com/external_experienced"
    search_terms: []

# Company job boards on Greenhouse, Lever and Ashby. Read only when
# ENABLE_ATS_BOARDS=true. Only titles with an internship signal are kept.
#
# To add a company, open its careers page and look at the board link:
#   boards.greenhouse.io/<token>   or   job-boards.greenhouse.io/<token>
#   jobs.lever.co/<token>
#   jobs.ashbyhq.com/<token>
# Put <token> below. startup marks small or fast-growing employers. verified stays
# false until someone has seen the board return jobs. A wrong token is reported
# as "not found" in the run summary and skipped; it never breaks a run.
ats_boards:
  # Greenhouse
  - {name: "Stripe", provider: greenhouse, token: stripe}
  - {name: "Airbnb", provider: greenhouse, token: airbnb}
  - {name: "Databricks", provider: greenhouse, token: databricks}
  - {name: "Coinbase", provider: greenhouse, token: coinbase}
  - {name: "Figma", provider: greenhouse, token: figma}
