# Company job boards on Greenhouse, Lever and Ashby. Read only when
# ENABLE_ATS_BOARDS=true. Only titles with an internship signal are kept.
#
# To add a company, open its careers page and look at the board link:
#   boards.greenhouse.io/<token>   or   job-boards.greenhouse.io/<token>
#   jobs.lever.co/<token>
#   jobs.ashbyhq.com/<token>
# Put <token> below. startup marks small or fast-growing employers. verified means the
# board checker saw it return jobs on 26 Oct 2026. A wrong token is reported
# as "not found" in the run summary and skipped; it never breaks a run.
