# Discovery targets for LinkedIn/Indeed (JobSpy) and Workday CXS tenants.
# Search terms cover 8 internship role families; all feed the same title filter
# (intern/summer/new-grad positive signals + seniority block in filters.py).

search:
  terms:
    # -- Product Management --
    - "Product Manager Intern"
    - "MBA Product Manager Intern"
    # -- Program & Project Management --
    - "Program Manager Intern"
    - "Project Manager Intern"
    # -- Product Marketing --
    - "Product Marketing Intern"
    # -- Strategy & GTM --
    - "Strategy Intern"
    - "Go-to-Market Intern"
    # -- Product Operations --
    - "Product Operations Intern"
    # -- Customer Success --
    - "Customer Success Intern"
    # -- Consulting --
    - "Management Consultant Intern"
  sites:
    - linkedin
    - indeed
    - google
    - zip_recruiter
  location: "United States"
  distance: 50
  # Fetch depth per term per site. Higher = better recall (captures ranks 26-50)
  # at low added LLM cost since the internship filter culls most before scoring.
  results_wanted: 50
  country_indeed: "USA"
  # 36h window (vs 24h) gives low-ranked good jobs more chances across runs;
  # upsert dedupe prevents re-processing anything already seen.
  hours_old: 36
  linkedin_fetch_description: true

# Each URL was checked against that company's public Workday job API.
# Starbucks, Nike, Amazon, and Microsoft do not publish a myworkdayjobs board,
# so they stay on the LinkedIn/Indeed search above.
# A saved browser session is still required before auto-fill for each company.
workday_tenants:
  - name: "NVIDIA"
    url: "https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite"
    search_terms: []

  - name: "Salesforce"
    url: "https://salesforce.wd12.myworkdayjobs.com/Futureforce_Internships"
    search_terms: []

  - name: "Workday"
    url: "https://workday.wd5.myworkdayjobs.com/Workday_Early_Career"
    search_terms: []

  - name: "Zillow"
    url: "https://zillow.wd5.myworkdayjobs.com/Zillow_Group_External"
    search_terms: []

  - name: "Boeing"
    url: "https://boeing.wd1.myworkdayjobs.com/EXTERNAL_CAREERS"
    search_terms: []

  - name: "Adobe"
    url: "https://adobe.wd5.myworkdayjobs.com/external_experienced"
    search_terms: []
