# Temporal check of Phase 16 feedback. This does not change scores or ranking.

version: phase17-v1

calibration:
  fold_count: 3
  evaluation_maturity_days: 45
  minimum_training_applications: 20
  minimum_holdout_applications: 20
  minimum_holdout_segment: 10
  strong_positive: [interview, offer]
  final_positive: [offer]
  probability_buckets:
    - {name: "0.00-0.19", min: 0.0, max: 0.2}
    - {name: "0.20-0.39", min: 0.2, max: 0.4}
    - {name: "0.40-0.59", min: 0.4, max: 0.6}
    - {name: "0.60-0.79", min: 0.6, max: 0.8}
    - {name: "0.80-1.00", min: 0.8, max: 1.01}
  top_k: [0.10, 0.20, 0.25]
  hypothetical_adjustment: false
