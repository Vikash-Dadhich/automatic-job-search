# Whether a vector-gate reject may enter the normal fit scorer.
# This is not a fit score, a priority score, or a threshold change.

version: phase10-v2

recovery:
  enabled: true
  # Independent evidence groups required. One signal is not enough.
  min_groups: 2
  role_confidences:
    - high
    - medium
  # UNKNOWN and OTHER are not targets.
  target_families:
    - PRODUCT_MANAGEMENT
    - CONSULTING
    - STRATEGY_TRANSFORMATION
    - PRODUCT_MARKETING
    - MARKETING
    - PROGRAM_PROJECT_OPERATIONS
  # Matched only against structured responsibility text. A single word is not a phrase.
  responsibility_phrases:
    - product management
    - product manager
    - management consulting
    - corporate strategy
    - business strategy
    - technology strategy
    - business transformation
    - product marketing
    - program management
    - program operations
    - product operations
