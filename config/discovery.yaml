# Discovery strategy. Family weights are search capacity, not fit scores.
# Phase 2 expands the query vocabulary. Do not treat this file as a ranking rubric.
#
# Source parameters (location, results_wanted, hours_old, Workday URLs) stay in
# config/targets.yaml. This file only says which families, buckets, and sources exist.

