name: Supervised trial (owner approved)

# Manual only. One run with production-sized caps, a throwaway SQLite database,
# no Telegram, no applying. Results are printed as annotations on the run.
# The OpenAI balance is the hard limit. OPENAI_MAX_REQUESTS caps requests.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA. The checkout must match it.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pipeline-trial
  cancel-in-progress: false

jobs:
  run-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          printf 'trial_sha=%s\n' "$sha"
          [ "$sha" = "$EXPECTED_SHA" ] || { echo "Checkout does not match."; exit 1; }

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --no-dev

      - name: Run probe
        run: uv run python scripts/embedding_probe.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MAX_REQUESTS: "5"
          EMBED_MAX_INPUTS: "20"

