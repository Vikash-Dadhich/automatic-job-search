name: Job Pipeline

# Discovery → score → resume → prep against Neon.
# The clock is an external cron (9:00 and 19:00 America/Los_Angeles) that
# calls run-once. This workflow stays manual so the two clocks do not both fire.
# Workday apply / LinkedIn scrape stay off (no Playwright sessions in Actions).
on:
  workflow_dispatch: {}

# One pipeline at a time. A manual dispatch cancels an in-flight scheduled run
# so two overlapping runs cannot double-score jobs or send duplicate cards.
concurrency:
  group: pipeline
  cancel-in-progress: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --no-dev

      - name: Run pipeline once
        timeout-minutes: 45
        run: uv run python main.py run-once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Discovery + score + suggest + prep only (no browser)
          # Only pass internship roles to scoring (summer search mode).
          INTERNSHIP_ONLY: "true"
          ENABLE_APPLY: "false"
          ENABLE_BENCHMARK: "false"
          ENABLE_LINKEDIN_SCRAPE: "false"
          ENABLE_REVIEWS: "true"
          ENABLE_PREP_PACK: "false"
          # Full-mode prep packs only. Brief mode sends one shortlist file.
          PREP_PACK_LIMIT: "20"
          # Brief mode: one text file of the persisted shortlist (shortlist_rank).
          # Set to false to re-enable full essay-drafted prep packs.
          PREP_PACK_BRIEF: "true"
          # Skill-suggestion cards are not being reviewed right now (resume
          # edits are manual) — leaving this on is pure LLM-call overhead.
          ENABLE_SUGGESTIONS: "false"
          TIMEZONE: America/Los_Angeles
          LLM_PROVIDER: openai
          OPENAI_SCORER_MODEL: gpt-5-mini
          OPENAI_WRITER_MODEL: gpt-5-mini
          # Score and link only. Set true to draft Tier 1 outreach and cover letters.
          TIER_ONE_DRAFTS_ENABLED: "false"
          # Spend and volume caps. Without these every limit is unlimited.
          # About $0.0025 per OpenAI response in the Oct trial, so 150 requests
          # caps one run at roughly $0.40. Raise only with cost evidence.
          # The plan is deterministic: 40 keeps each family's primary phrases.
          SEARCH_CAPACITY: "40"
          INGEST_POSTING_CAP: "1500"
          EMBED_MAX_INPUTS: "1500"
          ROLE_CLASSIFY_MAX_CALLS: "60"
          SCORE_BUDGET: "60"
          OPENAI_MAX_REQUESTS: "150"
          # Company boards (verified list in targets.yaml) and Simplify-based board discovery.
          ENABLE_ATS_BOARDS: "true"
          SIMPLIFY_DISCOVERY: "true"
          # Apply queue: at most this many new cards in any 24 hours.
          QUEUE_DAILY_LIMIT: "15"
          # Only product, consulting, strategy and business titles are scored, and the
          # queue follows config/queue_mix.yaml (40% product, 40% consulting, 20% other).
          TARGET_TITLES_ONLY: "true"
          QUEUE_MIX: "true"

      # Stage timings from the database, shown even if the step above timed out.
      - name: Stage report
        if: always()
        run: uv run python scripts/stage_report.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
