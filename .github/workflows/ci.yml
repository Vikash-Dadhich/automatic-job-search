name: CI

# Code checks only. The live discovery pipeline stays in pipeline.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Pytest
        run: |
          set +e
          uv run pytest -q -rfE --tb=short > pytest.out 2>&1
          code=$?
          tail -n 5 pytest.out
          # Failures show up as annotations so they can be read without the raw log.
          grep -E "^(FAILED|ERROR) " pytest.out | head -20 | cut -c1-400 \
            | while read -r l; do echo "::error::$l"; done
          grep -E "^E  " pytest.out | head -25 | cut -c1-300 \
            | while read -r l; do echo "::warning::$l"; done
          exit $code

      - name: Ruff
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright
