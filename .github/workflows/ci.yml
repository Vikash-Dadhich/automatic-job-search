name: CI

# Code checks only. The live discovery pipeline stays in pipeline.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Pytest
        run: uv run pytest -q

      - name: Ruff
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright
