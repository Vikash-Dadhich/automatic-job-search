name: Check company boards

# Manual only. Reads the public board feeds listed in config/targets.yaml and prints
# which ones work. No secrets, no model calls, no database.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - run: uv run python scripts/check_boards.py
