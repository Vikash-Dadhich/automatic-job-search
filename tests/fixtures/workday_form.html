<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Workday Application Fixture</title>
</head>
<body>
  <h1>Apply — Software Engineer</h1>
  <form id="app-form">
    <label for="email">Email Address</label>
    <input id="email" name="email" type="email" role="textbox" aria-label="Email Address" />

    <label for="phone">Phone Number</label>
    <input id="phone" name="phone" type="tel" role="textbox" aria-label="Phone Number" />

    <label for="resume">Upload Resume</label>
    <input id="resume" name="resume" type="file" aria-label="Upload Resume" />

    <button type="button">Next</button>
    <button type="button">Submit Application</button>
  </form>
  <section id="review" hidden>
    <h2>Review your application</h2>
    <p>Please review before submitting.</p>
  </section>
</body>
</html>
